<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>কিচেন ড্যাশবোর্ড — Red Carpet</title><meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../css/staff.css">
</head>
<body class="kitchen">
<div id="loginMount"></div>
<div id="app" hidden>
  <header class="sbar"><div class="sbar-l"><img src="../assets/logo-512.png" alt="" width="40" height="40"><div><b>কিচেন ড্যাশবোর্ড</b><small id="liveState">লাইভ</small></div></div>
    <div class="sbar-r"><button class="chipbtn" id="soundBtn"><i class="fa-solid fa-bell"></i> সাউন্ড চালু</button>
      <button class="chipbtn" id="fsBtn"><i class="fa-solid fa-expand"></i> ফুলস্ক্রিন</button>
      <button class="chipbtn" data-logout><i class="fa-solid fa-right-from-bracket"></i> লগআউট</button></div></header>
  <nav class="tabs3" id="tabs3"></nav>
  <main class="board" id="board"></main>
  <footer class="sfoot"><span id="creditHost"></span></footer>
</div>
<script type="module">
import { LOGIN_HTML, guard, confirmBox, alertBox } from '../js/staff.js';
import * as DB from '../js/db.js';
import { tr, num, money, esc } from '../js/i18n.js';
document.getElementById('loginMount').innerHTML = LOGIN_HTML('কিচেন');

// [স্ট্যাটাস, কলামের নাম, আইকন, মোবাইল ট্যাবের ছোট নাম]
const COLS = [['pending', 'নতুন — পেন্ডিং', 'fa-hourglass-half', 'পেন্ডিং'], ['preparing', 'প্রস্তুত হচ্ছে', 'fa-fire-burner', 'প্রস্তুত'], ['ready', 'রেডি — নিয়ে যাবে', 'fa-bell-concierge', 'রেডি'], ['completed', 'আজকের সম্পন্ন (Done)', 'fa-circle-check', 'সম্পন্ন']];
let orders = [], known = null, sound = true, tab = 'pending', ctx;

function beep() {
  if (!sound) return;
  try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    [880, 1175, 880].forEach((f, i) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = f; o.connect(g); g.connect(ctx.destination);
      const t = ctx.currentTime + i * .18; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.35, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .16); o.start(t); o.stop(t + .17); });
  } catch {}
}
const ago = ms => { const m = Math.max(0, Math.floor((Date.now() - ms) / 60000)); return m < 1 ? 'এইমাত্র' : m < 60 ? num(m) + ' মিনিট আগে' : num(Math.floor(m / 60)) + ' ঘণ্টা আগে'; };
const clock = ms => new Date(ms).toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });
const startOfDay = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };

const li = i => `<li><b>${num(i.qty)}×</b> ${esc(tr(i.name))}${i.variant ? ` <em>(${esc(tr(i.variant))})</em>` : ''}</li>`;
const rounds = o => { const m = {}; o.items.forEach(i => (m[i.r || 1] = m[i.r || 1] || []).push(i)); return Object.keys(m).map(Number).sort((a, b) => a - b).map(r => [r, m[r]]); };
function itemsHtml(o) {
  const rs = rounds(o); if (rs.length < 2) return o.items.map(li).join('');
  return rs.map(([r, its], k) => `<li class="rd${k ? ' new' : ''}">${k ? `<i class="fa-solid fa-circle-plus"></i> আরও অর্ডার — ${num(r)}য় বার · ${clock(its[0].at || o.updatedAt)}` : 'প্রথম অর্ডার'}</li>` + its.map(li).join('')).join('');
}
function card(o) {
  const late = (o.status === 'pending' || o.status === 'preparing') && Date.now() - o.createdAt > 20 * 60000;
  const next = { pending: ['preparing', 'অর্ডার নিন — রান্না শুরু', 'fa-fire-burner'], preparing: ['ready', 'রেডি করুন', 'fa-bell-concierge'], ready: ['completed', 'সম্পন্ন — কাস্টমার নিয়ে গেছে', 'fa-circle-check'] }[o.status];
  return `<article class="oc ${late ? 'late' : ''} st-${o.status}" data-id="${esc(o.id)}">
    <header><b class="no">#${num(o.orderNo)}</b>${rounds(o).length > 1 ? '<span class="morebadge"><i class="fa-solid fa-circle-plus"></i> আরও অর্ডার</span>' : ''}<span class="where ${o.type}">${o.type === 'takeaway' ? '<i class="fa-solid fa-bag-shopping"></i> টেকঅ্যাওয়ে' : `<i class="fa-solid fa-chair"></i> টেবিল ${num(o.table)}`}</span></header>
    <div class="who">${o.name ? `<i class="fa-solid fa-user"></i> ${esc(o.name)}` : ''}${o.phone ? ` · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a>` : ''}</div>
    <ul class="its">${itemsHtml(o)}</ul>
    ${o.note ? `<p class="note"><i class="fa-solid fa-note-sticky"></i> ${esc(o.note)}</p>` : ''}
    <footer><span class="meta">${clock(o.createdAt)} · ${ago(o.createdAt)} · ${money(o.total)}</span>
      <div class="acts">${o.status === 'cancelled' ? '<span class="cx">বাতিল</span>' : ''}
        ${next ? `<button class="go" data-act="${next[0]}"><i class="fa-solid ${next[2]}"></i> ${next[1]}</button>` : ''}
        ${o.status === 'completed' ? '<button class="ghost" data-act="ready">↩ রেডিতে ফিরান</button>' : ''}
        ${['pending', 'preparing', 'ready'].includes(o.status) ? '<button class="ghost bad" data-act="cancelled">বাতিল</button>' : ''}</div></footer></article>`;
}
function render() {
  const day = startOfDay();
  const by = { pending: [], preparing: [], ready: [], completed: [] };
  orders.forEach(o => { if (o.status === 'pending') by.pending.push(o); else if (o.status === 'preparing') by.preparing.push(o); else if (o.status === 'ready') by.ready.push(o);
    else if ((o.status === 'completed' || o.status === 'cancelled') && o.createdAt >= day) by.completed.push(o); });
  ['pending', 'preparing', 'ready'].forEach(k => by[k].sort((a, b) => a.createdAt - b.createdAt));
  document.getElementById('tabs3').innerHTML = COLS.map(c => `<button class="${tab === c[0] ? 'on' : ''}" data-tab="${c[0]}">${c[3]} <b>${num(by[c[0]].length)}</b></button>`).join('');
  document.getElementById('board').innerHTML = COLS.map(c => `<section class="col ${tab === c[0] ? 'show' : ''}" data-col="${c[0]}"><h2><i class="fa-solid ${c[2]}"></i> ${c[1]} <b>${num(by[c[0]].length)}</b></h2>
    <div class="list">${by[c[0]].map(card).join('') || '<p class="none">কোনো অর্ডার নেই</p>'}</div></section>`).join('');
  document.title = (by.pending.length ? `(${by.pending.length}) ` : '') + 'কিচেন — Red Carpet';
}
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; render(); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = b.closest('.oc').dataset.id, st = b.dataset.act;
  if (st === 'cancelled') {
    const no = b.closest('.oc').querySelector('.no')?.textContent || '';
    if (!await confirmBox({ icon: 'fa-ban', title: `অর্ডার ${no} বাতিল করবেন?`, message: 'কাস্টমার তার ট্র্যাকিং পেজে "বাতিল" দেখতে পাবে।', ok: 'হ্যাঁ, বাতিল করুন', cancel: 'না, থাক' })) return;
  }
  b.disabled = true;
  try { await DB.update('orders', id, { status: st }); } catch (ex) { console.error(ex); alertBox({ icon: 'fa-wifi', tone: 'danger', title: 'স্ট্যাটাস বদলানো যায়নি', message: 'ইন্টারনেট সংযোগ ও লগইন দেখে আবার চেষ্টা করুন।' }); b.disabled = false; }
});
guard(['kitchen', 'admin'], () => {
  DB.setPoll((window.RC && window.RC.poll && window.RC.poll.kitchen) || 4000);
  document.getElementById('fsBtn').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); };
  document.getElementById('soundBtn').onclick = e => { sound = !sound; e.currentTarget.innerHTML = sound ? '<i class="fa-solid fa-bell"></i> সাউন্ড চালু' : '<i class="fa-solid fa-bell-slash"></i> সাউন্ড বন্ধ'; if (sound) beep(); };
  DB.sub('orders', (list, err) => {
    document.getElementById('liveState').textContent = err ? '⚠ ডেটা পাওয়া যাচ্ছে না (ইন্টারনেট/লগইন দেখুন)' : 'লাইভ — নতুন অর্ডার নিজে থেকেই আসবে';
    orders = list;
    const ids = new Set(list.filter(o => o.status === 'pending').map(o => o.id));
    if (known && [...ids].some(i => !known.has(i))) { beep(); navigator.vibrate?.(300); }
    known = ids; render();
  }, { orderBy: 'createdAt', dir: 'desc', limit: 300 });
  setInterval(render, 30000);
});
</script>
</body>
</html>
